name: Validação de testes

on:
  pull_request:
    types: 
      - opened
      - synchronize
      - reopened
    
    branches: ["main", "master", "develop"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-pr:
    name: Testar PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permissão ao Gradlew
        run: chmod +x gradlew

      - name: Executar testes unitários
        id: run_tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest

      - name: Gerenciar Labels de Teste no PR
        uses: actions/github-script@v7
        with:
          script: |
            const testStatus = '${{ steps.run_tests.outcome }}';
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: prInfo } = await github.rest.issues.get({
              owner, repo, issue_number
            });

            const oldLabels = prInfo.labels
              .map(l => l.name)
              .filter(name => name.startsWith('tests-'));

            for (const labelName of oldLabels) {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number, name: labelName
              });
            }

            const newLabel = (testStatus === 'success') ? 'tests-passed' : 'tests-failed';
            await github.rest.issues.addLabels({
              owner, repo, issue_number, labels: [newLabel]
            });

            if (testStatus !== 'success') {
              core.setFailed('Os testes unitários do Android falharam!');
            }